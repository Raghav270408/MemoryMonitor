<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex flex-col items-center p-6">

    <header class="w-full max-w-4xl flex justify-between items-center mb-8 bg-gray-800 px-5 py-3 rounded-lg">
        <h1 class="text-xl font-bold tracking-wider">MEMORY MONITOR</h1>
        <div class="flex items-center space-x-2">
            <div id="connection-indicator" class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
            <span id="connection-text" class="text-sm text-gray-300">Disconnected</span>
        </div>
    </header>

    <main class="w-full max-w-4xl flex flex-col gap-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- RAM -->
            <section class="bg-gray-800 p-6 rounded-lg flex flex-col items-center">
                <h2 class="text-sm font-semibold mb-5 tracking-widest uppercase text-gray-500">RAM</h2>

                <div class="relative w-44 h-44 rounded-full flex items-center justify-center mb-5" id="ram-circle">
                    <div class="absolute w-36 h-36 bg-gray-800 rounded-full flex flex-col items-center justify-center">
                        <span id="ram-percentage" class="text-3xl font-bold">0%</span>
                        <span class="text-xs text-gray-500 mt-0.5">Used</span>
                    </div>
                </div>

                <div class="w-full grid grid-cols-2 gap-3 text-center mb-4">
                    <div class="bg-gray-900 px-3 py-2 rounded">
                        <div class="text-gray-500 text-[10px] uppercase tracking-wider">Used</div>
                        <div id="ram-used" class="font-semibold text-sm mt-0.5">—</div>
                    </div>
                    <div class="bg-gray-900 px-3 py-2 rounded">
                        <div class="text-gray-500 text-[10px] uppercase tracking-wider">Available</div>
                        <div id="ram-available" class="font-semibold text-sm mt-0.5">—</div>
                    </div>
                </div>

                <div class="w-full text-center text-sm text-gray-400 mb-4">
                    Total: <span id="ram-total" class="text-white font-semibold">—</span>
                </div>

                <div class="w-full space-y-1.5 text-xs">
                    <div class="flex justify-between">
                        <span class="text-gray-500">Memory Pressure</span>
                        <span id="ram-pressure" class="text-gray-400">—</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">System Status</span>
                        <span id="ram-status" class="text-gray-400">—</span>
                    </div>
                </div>
            </section>

            <!-- STORAGE -->
            <section class="bg-gray-800 p-6 rounded-lg flex flex-col">
                <div class="flex items-center justify-center mb-6 space-x-2">
                    <svg class="w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M4 20h16v-4H4v4zm0-6h16v-4H4v4zm0-8v4h16V6H4z"/>
                    </svg>
                    <h2 class="text-sm font-semibold tracking-widest uppercase text-gray-500">STORAGE</h2>
                </div>

                <div class="flex-grow flex flex-col justify-center">
                    <div class="text-center mb-4">
                        <span id="storage-percentage" class="text-4xl font-bold">0%</span>
                        <span class="text-base text-gray-500 ml-1">Used</span>
                    </div>

                    <div class="text-center text-sm text-gray-400 mb-3">
                        <span id="storage-used-val">—</span> / <span id="storage-total-val">—</span>
                    </div>

                    <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden mb-6">
                        <div id="storage-bar" class="h-full bg-blue-500 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-center">
                        <div class="bg-gray-900 px-3 py-2 rounded">
                            <div class="text-gray-500 text-[10px] uppercase tracking-wider">Used</div>
                            <div id="storage-used" class="font-semibold text-sm mt-0.5">—</div>
                        </div>
                        <div class="bg-gray-900 px-3 py-2 rounded">
                            <div class="text-gray-500 text-[10px] uppercase tracking-wider">Free</div>
                            <div id="storage-free" class="font-semibold text-sm mt-0.5">—</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- APPLICATION MEMORY -->
        <section class="w-full bg-gray-800 p-5 rounded-lg">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-sm font-semibold tracking-widest uppercase text-gray-500">APPLICATION RAM</h2>
                    <p id="apps-subtitle" class="text-[11px] text-gray-600 mt-0.5">Applications ≥ 10 MB — via ADB</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="apps-source-badge" class="text-[11px] px-2 py-0.5 rounded bg-gray-700 text-gray-400 font-mono">—</span>
                    <input type="text" id="apps-search" placeholder="Filter..." class="bg-gray-900 text-xs px-2.5 py-1.5 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-300 w-28">
                </div>
            </div>

            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="text-[10px] uppercase text-gray-600 border-b border-gray-700">
                        <th class="py-2 px-2">Application</th>
                        <th class="py-2 px-2 text-right">RAM</th>
                    </tr>
                </thead>
                <tbody id="apps-table-body" class="divide-y divide-gray-700/50">
                </tbody>
            </table>

            <div id="apps-empty-state" class="py-8 text-center text-gray-600 text-xs">
                <p id="apps-empty-message">No per-app data available</p>
                <p id="apps-empty-submessage" class="mt-1 text-gray-700">Connect via ADB to monitor application RAM</p>
            </div>
        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
